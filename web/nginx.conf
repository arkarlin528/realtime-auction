# Serves the React app and load-balances API + SignalR traffic across the api replicas.
# Docker's DNS returns one address per replica for "api", and nginx round-robins between them.
# No sticky sessions needed: the client uses WebSockets with negotiation skipped, so each
# realtime connection lives on a single request to a single instance.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/(api|swagger|docs|health)(/|$) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
